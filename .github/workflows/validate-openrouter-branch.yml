name: Validate OpenRouter branch

on:
  push:
    branches:
      - feature/openrouter-llm-routing
    paths:
      - "mcp-server/**"
      - "frontend/**"
      - ".env.example"
      - "docker-compose.yml"
      - ".github/workflows/validate-openrouter-branch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-openrouter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Cargo check and OpenRouter unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp-server

      - name: Check MCP server
        run: cargo check --locked

      - name: Test OpenRouter privacy behavior
        run: cargo test --locked llm::client::tests

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
