name: Publish OpenRouter frontend image

on:
  push:
    branches: [feature/openrouter-llm-routing]
    paths:
      - "frontend/**"
      - ".github/workflows/publish-openrouter-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/danaaa913/aria-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set image tags
        id: tags
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "commit=${IMAGE_NAME}:openrouter-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "branch=${IMAGE_NAME}:openrouter-branch" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.commit }}
            ${{ steps.tags.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
